[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feedtest-local"
version = "0.3.1"
description = "Reproducible WebSocket market feed failure tests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["websocket", "market-data", "replay", "testing", "kraken"]
requires-python = ">=3.11"
dependencies = ["websockets==16.0", "aiohttp>=3.11,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1"]
ui = ["playwright>=1.50,<2"]

[project.scripts]
feedtest = "feedtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feedtest = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
